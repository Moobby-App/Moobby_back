[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mooby-back"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.146.0",
    "pydantic==2.14.3",
    "psycopg[binary]>=3,<4",
    "scikit-learn==1.9.1",
    "redis==6.4.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
embedding = ["sentence-transformers==5.1.2"]
push = ["httpx[http2]>=0.28,<1", "PyJWT[crypto]>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
